name: AI 知识视频工坊

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
    # 只在 AI 知识视频工坊自己的文件变动时构建（docs/ 会打进安装包，所以文档改动也要重新构建）
    paths: ["studio/**", "packaging/**", "tests/**", "docs/**", "run.py", "requirements.txt", "README.md", "start-mac.command", "start-windows.bat", ".github/workflows/build.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: macos-latest          # Apple Silicon（用户的 Mac 是 M4），不构建 Intel 版
            label: macOS-AppleSilicon
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Install NSIS
        if: runner.os == 'Windows'
        # Chocolatey 偶尔宕机（503/504），所以：已有就跳过 → choco 重试 3 次 → 官方安装包兜底
        shell: pwsh
        run: |
          $m = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $m) { exit 0 }
          for ($i = 1; $i -le 3; $i++) {
            choco install nsis -y --no-progress
            if (Test-Path $m) { exit 0 }
            Start-Sleep -Seconds (15 * $i)
          }
          Invoke-WebRequest "https://sourceforge.net/projects/nsis/files/NSIS%203/3.10/nsis-3.10-setup.exe/download" -OutFile "$env:RUNNER_TEMP\nsis-setup.exe" -UserAgent "Wget" -MaximumRedirection 10
          Start-Process "$env:RUNNER_TEMP\nsis-setup.exe" -ArgumentList "/S" -Wait
          if (Test-Path $m) { exit 0 }
          exit 1
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build
        # Windows：Setup.exe（NSIS）+ 免安装 zip；macOS：.app 打成 .dmg。都带 README.md、docs/ 和手写源码，并自检
        run: python packaging/build.py
      - name: Smoke test
        # 启动包里的程序：接口、文档、源码；窗口模式能否建窗口；「退出」后进程结束、端口关闭
        run: python packaging/smoke.py
      - name: List outputs
        shell: bash
        run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: AIVideoStudio-${{ matrix.label }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
