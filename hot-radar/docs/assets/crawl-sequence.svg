<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" width="1120" height="720" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4a505a"/></marker>
  </defs>
  <rect width="1120" height="720" fill="#ffffff"/>
  <text x="24" y="32" font-size="19" font-weight="700" fill="#13161b">调用链：点「立即抓取」之后（hotradar 1.0.0 + TrendRadar 6.11.0）</text>
  <!-- 泳道 -->
  <g font-weight="700" font-size="14">
    <rect x="24" y="50" width="230" height="36" rx="6" fill="#e9f1fb"/><text x="40" y="74" fill="#1d4f8a">网页 web/app.js</text>
    <rect x="290" y="50" width="250" height="36" rx="6" fill="#fdeee6"/><text x="306" y="74" fill="#d9480f">主进程 server.py / runner.py</text>
    <rect x="576" y="50" width="290" height="36" rx="6" fill="#f4f6fa"/><text x="592" y="74" fill="#13161b">工作进程 worker.py → 上游</text>
    <rect x="902" y="50" width="194" height="36" rx="6" fill="#fff4dc"/><text x="918" y="74" fill="#8a5a00">外部 / 数据目录</text>
  </g>
  <g stroke="#cdd2d9" stroke-dasharray="4 4"><line x1="139" y1="86" x2="139" y2="700"/><line x1="415" y1="86" x2="415" y2="700"/><line x1="721" y1="86" x2="721" y2="700"/><line x1="999" y1="86" x2="999" y2="700"/></g>
  <g stroke="#4a505a" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <line x1="139" y1="116" x2="410" y2="116"/>
    <line x1="415" y1="160" x2="716" y2="160"/>
    <line x1="721" y1="218" x2="994" y2="218"/>
    <line x1="721" y1="262" x2="994" y2="262"/>
    <line x1="721" y1="306" x2="994" y2="306"/>
    <line x1="721" y1="394" x2="994" y2="394"/>
    <line x1="721" y1="438" x2="994" y2="438"/>
    <line x1="721" y1="482" x2="994" y2="482"/>
    <line x1="716" y1="540" x2="420" y2="540"/>
    <line x1="139" y1="584" x2="410" y2="584"/>
    <line x1="410" y1="610" x2="144" y2="610"/>
    <line x1="721" y1="650" x2="420" y2="650"/>
  </g>
  <g fill="#13161b">
    <text x="150" y="108">POST /api/run {task:"crawl"}（带令牌）</text>
    <text x="424" y="140">Runner.start：确认没有别的任务；建 logs/run-时间.log；</text>
    <text x="424" y="154">密钥转环境变量；Popen(本程序 --worker crawl …)</text>
    <text x="730" y="186">worker.run：输出写进日志文件、启动看门狗、chdir 工作区；</text>
    <text x="730" y="200">替换 webbrowser.open / check_all_versions；调用上游 main()</text>
    <text x="730" y="212" font-size="12" fill="#4a505a">load_config → NewsAnalyzer.run()</text>
    <text x="1008" y="212">config/*.yaml</text>
    <text x="730" y="256" font-size="12" fill="#4a505a">_crawl_data → DataFetcher.crawl_websites（逐平台，间隔 2 秒）</text>
    <text x="1008" y="256">newsnow /api/s?id=…</text>
    <text x="730" y="300" font-size="12" fill="#4a505a">storage_manager.save_news_data</text>
    <text x="1008" y="300">output/news/日期.db</text>
    <text x="730" y="340" font-size="12" fill="#4a505a">_crawl_rss_data → RSSFetcher.fetch_all → save_rss_data</text>
    <text x="730" y="356" font-size="12" fill="#4a505a">_execute_mode_strategy：Scheduler.resolve（timeline 时段）</text>
    <text x="730" y="372" font-size="12" fill="#4a505a">→ load_frequency_words → _run_analysis_pipeline</text>
    <text x="730" y="388" font-size="12" fill="#4a505a">count_frequency 或 run_ai_filter；_run_ai_analysis；翻译</text>
    <text x="1008" y="388">大模型（可选）</text>
    <text x="730" y="432" font-size="12" fill="#4a505a">generate_html → 快照 + latest/模式.html</text>
    <text x="1008" y="432">output/html/</text>
    <text x="730" y="476" font-size="12" fill="#4a505a">_send_notification_if_needed → 分批发送</text>
    <text x="1008" y="476">飞书/钉钉/企业微信…</text>
    <text x="430" y="520">runner._watch：每 0.5 秒读日志新行，Progress.feed</text>
    <text x="430" y="534">解析「获取 X 成功」「请求 X 失败」「HTML报告已生成」等</text>
    <text x="150" y="576">GET /api/status（运行中每秒一次）</text>
    <text x="150" y="604" font-size="12" fill="#4a505a">阶段、百分比、平台成功/失败、日志末 60 行</text>
    <text x="430" y="642">进程退出 → 写 runs.json（结果、失败平台、报告路径）</text>
    <text x="430" y="670" font-size="12" fill="#4a505a">网页提示结束；「最新报告」在沙箱 iframe 里显示 /report/main/latest/模式.html</text>
    <text x="430" y="692" font-size="12" fill="#4a505a">定时抓取由 runner.scheduler_loop 每 5 秒检查一次，到点走同一条路径（触发=定时）</text>
  </g>
</svg>
